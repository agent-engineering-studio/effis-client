site_name: effis-client
site_description: "Client for the public EFFIS services: burnt-area perimeters and official FWI rasters"
site_url: https://agentengineering.it/effis-client/
repo_url: https://github.com/agent-engineering-studio/effis-client
repo_name: agent-engineering-studio/effis-client
edit_uri: edit/main/docs/
copyright: "Code Apache-2.0. Data: European Forest Fire Information System (EFFIS), Copernicus Emergency Management Service, © European Union, CC BY 4.0."

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: orange
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: orange
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  scripts/

nav:
  - Home: index.md
  - API reference:
      - Burnt-area perimeters: api/perimeters.md
      - Fire Weather Index (WMS): api/fwi.md
      - Errors: api/errors.md
  - Changelog: changelog.md
  - Contributing: contributing.md

validation:
  links:
    not_found: info
    unrecognized_links: info
